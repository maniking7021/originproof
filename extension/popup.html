<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OriginProof</title>
<style>
  body { font-family: system-ui, sans-serif; width: 280px; margin: 0; padding: 14px; background: #0b1220; color: #e8eef7; }
  h1 { font-size: 16px; margin: 0 0 6px; }
  p { font-size: 13px; color: #93a3bd; margin: 0 0 10px; }
  input { width: 100%; box-sizing: border-box; padding: 8px; border-radius: 8px; border: 1px solid #22314f; background: #0b1220; color: #e8eef7; }
  button { width: 100%; margin-top: 8px; padding: 9px; border: none; border-radius: 8px; background: #2dd4bf; color: #04211d; font-weight: 700; cursor: pointer; }
  .hint { font-size: 12px; color: #64748b; margin-top: 10px; }
</style>
</head>
<body>
  <h1>OriginProof</h1>
  <p>Paste a SHA-256 hash (0x…) to open its verification page, or right-click any image on the web → “Verify with OriginProof”.</p>
  <input id="hashInput" type="text" placeholder="0x…" maxlength="66">
  <button id="goBtn">Verify hash</button>
  <p class="hint">Hashing runs locally in the extension — images are never uploaded. No wallet needed to verify.</p>
  <script src="popup.js"></script>
</body>
</html>
